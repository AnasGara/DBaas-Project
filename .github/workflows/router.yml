name: Webhook router verification
on:
  push:
    paths: ['webhook-router/**', '.github/workflows/router.yml']
  pull_request:
    paths: ['webhook-router/**', '.github/workflows/router.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webhook-router
    env:
      AWS_DEFAULT_REGION: eu-west-3
      SAM_CLI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            webhook-router/requirements*.txt
            webhook-router/requirements-dev.lock
            webhook-router/src/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python scripts/audit_dependencies.py
      - run: pytest --cov=router --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - run: sam validate --lint --region eu-west-3
      - run: sam build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 14
          name: router-verification
          path: webhook-router/coverage.xml
