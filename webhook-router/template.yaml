AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable multi-tenant webhook router with transactional outbox and bounded at-least-once delivery.
Parameters:
  ApplicationName:
    Type: String
    Default: webhook-router
    AllowedPattern: '[a-z][a-z0-9-]{2,23}'
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - staging
    - prod
  AllowedDestinationHosts:
    Type: String
    Description: Comma-separated exact HTTPS destination hostnames. No wildcards; empty denies all destinations.
    Default: ''
  AllowedPrivateCidrs:
    Type: String
    Description: Explicit private destination networks, e.g. 10.20.0.0/16. Empty denies private addresses.
    Default: ''
  DestinationSecretPrefix:
    Type: String
    Default: destinations/
    AllowedPattern: '[a-zA-Z0-9/_-]+/'
  AlarmEmail:
    Type: String
    Default: ''
    AllowedPattern: ^$|^[^\s@]+@[^\s@]+\.[^\s@]+$
  EventRetentionDays:
    Type: Number
    Default: 90
    MinValue: 30
    MaxValue: 365
  WorkerConcurrency:
    Type: Number
    Default: 20
    MinValue: 2
    MaxValue: 200
  ApiRateLimit:
    Type: Number
    Default: 100
    MinValue: 1
  ApiBurstLimit:
    Type: Number
    Default: 200
    MinValue: 1
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Optional private subnets for the delivery worker; requires security groups and egress/endpoints.
  WorkerSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
Conditions:
  IsProd:
    Fn::Equals:
    - Ref: Environment
    - prod
  HasAlarmEmail:
    Fn::Not:
    - Fn::Equals:
      - Ref: AlarmEmail
      - ''
  UseVpc:
    Fn::Not:
    - Fn::Equals:
      - Fn::Join:
        - ''
        - Ref: PrivateSubnetIds
      - ''
Globals:
  Function:
    Runtime: python3.12
    Architectures:
    - arm64
    CodeUri: src/
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        EVENTS_TABLE:
          Ref: EventsTable
        OUTBOX_TABLE:
          Ref: OutboxTable
        ROUTES_TABLE:
          Ref: RoutesTable
        DELIVERY_QUEUE_URL:
          Ref: DeliveryQueue
        ALLOWED_DESTINATION_HOSTS:
          Ref: AllowedDestinationHosts
        ALLOWED_PRIVATE_CIDRS:
          Ref: AllowedPrivateCidrs
        DESTINATION_SECRET_PREFIX_ARN:
          Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ApplicationName}/${Environment}/${DestinationSecretPrefix}
        EVENT_RETENTION_DAYS:
          Ref: EventRetentionDays
        AUTH_SECRET_ARN:
          Ref: AuthSecret
        APPLICATION_NAME:
          Ref: ApplicationName
Resources:
  RoutesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${ApplicationName}-${Environment}-routes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: tenant_id
        AttributeType: S
      - AttributeName: event_type
        AttributeType: S
      KeySchema:
      - AttributeName: tenant_id
        KeyType: HASH
      - AttributeName: event_type
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled:
        Fn::If:
        - IsProd
        - true
        - false
  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${ApplicationName}-${Environment}-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled:
        Fn::If:
        - IsProd
        - true
        - false
  OutboxTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${ApplicationName}-${Environment}-outbox
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: shard
        AttributeType: S
      - AttributeName: due_at
        AttributeType: N
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: due
        KeySchema:
        - AttributeName: shard
          KeyType: HASH
        - AttributeName: due_at
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled:
        Fn::If:
        - IsProd
        - true
        - false
  AuthSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Hashed tenant bearer tokens, provider scopes and API usage keys. Provision with manage.py.
      SecretString: '{"clients":[]}'
  DeliveryDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  StreamFailureQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  DeliveryQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - DeliveryDLQ
          - Arn
        maxReceiveCount: 8
  QueueTLS:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: DeliveryQueue
      - Ref: DeliveryDLQ
      - Ref: StreamFailureQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Deny
          Principal: '*'
          Action: sqs:*
          Resource:
          - Fn::GetAtt:
            - DeliveryQueue
            - Arn
          - Fn::GetAtt:
            - DeliveryDLQ
            - Arn
          - Fn::GetAtt:
            - StreamFailureQueue
            - Arn
          Condition:
            Bool:
              aws:SecureTransport: 'false'
  WebhookApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${ApplicationName}-${Environment}
      StageName:
        Ref: Environment
      EndpointConfiguration: REGIONAL
      OpenApiVersion: 3.0.1
      ApiKeySourceType: AUTHORIZER
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn:
          Fn::GetAtt:
          - ApiAccessLogs
          - Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status","latency":"$context.integration.latency","sourceIp":"$context.identity.sourceIp"}'
      MethodSettings:
      - ResourcePath: /*
        HttpMethod: '*'
        MetricsEnabled: true
        DataTraceEnabled: false
        ThrottlingRateLimit:
          Ref: ApiRateLimit
        ThrottlingBurstLimit:
          Ref: ApiBurstLimit
      Auth:
        ApiKeyRequired: true
        DefaultAuthorizer: TenantAuthorizer
        Authorizers:
          TenantAuthorizer:
            FunctionArn:
              Fn::GetAtt:
              - AuthorizerFunction
              - Arn
            FunctionPayloadType: TOKEN
            Identity:
              Header: Authorization
              ReauthorizeEvery: 0
      GatewayResponses:
        DEFAULT_4XX:
          ResponseTemplates:
            application/json: '{"error":"request_rejected","request_id":"$context.requestId"}'
        DEFAULT_5XX:
          ResponseTemplates:
            application/json: '{"error":"temporarily_unavailable","request_id":"$context.requestId"}'
  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: WebhookApiStage
    Properties:
      UsagePlanName:
        Fn::Sub: ${ApplicationName}-${Environment}
      ApiStages:
      - ApiId:
          Ref: WebhookApi
        Stage:
          Ref: Environment
      Throttle:
        RateLimit:
          Ref: ApiRateLimit
        BurstLimit:
          Ref: ApiBurstLimit
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ApplicationName}-${Environment}-authorize
      Handler: router.authorizer.handler
      Timeout: 10
      ReservedConcurrentExecutions: 100
      Environment:
        Variables:
          SERVICE: authorize
      Role:
        Fn::GetAtt:
        - AuthorizerRole
        - Arn
    DependsOn: AuthorizerLogs
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ApplicationName}-${Environment}-ingest
      Handler: router.ingest.handler
      Timeout: 15
      ReservedConcurrentExecutions: 100
      Environment:
        Variables:
          SERVICE: ingest
      Events:
        Webhook:
          Type: Api
          Properties:
            RestApiId:
              Ref: WebhookApi
            Path: /webhooks
            Method: post
      Role:
        Fn::GetAtt:
        - IngestRole
        - Arn
    DependsOn: IngestLogs
  DispatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ApplicationName}-${Environment}-dispatch
      Handler: router.dispatch.handler
      Timeout: 60
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          SERVICE: dispatch
      Events:
        OutboxStream:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
              - OutboxTable
              - StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 0
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 3600
            BisectBatchOnFunctionError: true
            FunctionResponseTypes:
            - ReportBatchItemFailures
            FilterCriteria:
              Filters:
              - Pattern: '{"eventName":["INSERT"]}'
            DestinationConfig:
              OnFailure:
                Destination:
                  Fn::GetAtt:
                  - StreamFailureQueue
                  - Arn
        RecoverOutbox:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true
      Role:
        Fn::GetAtt:
        - DispatchRole
        - Arn
    DependsOn: DispatchLogs
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ApplicationName}-${Environment}-worker
      Handler: router.worker.handler
      ReservedConcurrentExecutions:
        Ref: WorkerConcurrency
      Environment:
        Variables:
          SERVICE: worker
      VpcConfig:
        Fn::If:
        - UseVpc
        - SubnetIds:
            Ref: PrivateSubnetIds
          SecurityGroupIds:
            Ref: WorkerSecurityGroupIds
        - Ref: AWS::NoValue
      Events:
        Deliver:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - DeliveryQueue
              - Arn
            BatchSize: 1
            FunctionResponseTypes:
            - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency:
                Ref: WorkerConcurrency
      Role:
        Fn::GetAtt:
        - WorkerRole
        - Arn
    DependsOn: WorkerLogs
  AuthorizerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ApplicationName}-${Environment}-authorize
      RetentionInDays:
        Fn::If:
        - IsProd
        - 90
        - 30
  IngestLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ApplicationName}-${Environment}-ingest
      RetentionInDays:
        Fn::If:
        - IsProd
        - 90
        - 30
  DispatchLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ApplicationName}-${Environment}-dispatch
      RetentionInDays:
        Fn::If:
        - IsProd
        - 90
        - 30
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ApplicationName}-${Environment}-worker
      RetentionInDays:
        Fn::If:
        - IsProd
        - 90
        - 30
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays:
        Fn::If:
        - IsProd
        - 90
        - 30
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        Fn::If:
        - HasAlarmEmail
        - - Protocol: email
            Endpoint:
              Ref: AlarmEmail
        - Ref: AWS::NoValue
  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
      - Ref: AlarmTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudwatch.amazonaws.com
          Action: sns:Publish
          Resource:
            Ref: AlarmTopic
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*
  LambdaErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda invocation errors exceed 1 percent over five minutes.
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlarmTopic
      Metrics:
      - Id: rate
        Expression: IF(SUM([i1,i2,i3,i4])>0,100*SUM([e1,e2,e3,e4])/SUM([i1,i2,i3,i4]),0)
        Label: Lambda error rate (%)
        ReturnData: true
      - Id: e1
        ReturnData: false
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Errors
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: IngestFunction
          Period: 300
          Stat: Sum
      - Id: e2
        ReturnData: false
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Errors
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: WorkerFunction
          Period: 300
          Stat: Sum
      - Id: e3
        ReturnData: false
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Errors
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: DispatchFunction
          Period: 300
          Stat: Sum
      - Id: e4
        ReturnData: false
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Errors
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: AuthorizerFunction
          Period: 300
          Stat: Sum
      - Id: i1
        ReturnData: false
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Invocations
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: IngestFunction
          Period: 300
          Stat: Sum
      - Id: i2
        ReturnData: false
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Invocations
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: WorkerFunction
          Period: 300
          Stat: Sum
      - Id: i3
        ReturnData: false
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Invocations
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: DispatchFunction
          Period: 300
          Stat: Sum
      - Id: i4
        ReturnData: false
        MetricStat:
          Metric:
            Namespace: AWS/Lambda
            MetricName: Invocations
            Dimensions:
            - Name: FunctionName
              Value:
                Ref: AuthorizerFunction
          Period: 300
          Stat: Sum
  DeliveryFailureRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Partial-batch failures are successful Lambda invocations; alert on application failures
        separately.
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlarmTopic
      Metrics:
      - Id: rate
        Expression: IF(attempts>0,100*FILL(failures,0)/attempts,0)
        ReturnData: true
      - Id: attempts
        ReturnData: false
        MetricStat:
          Metric:
            Namespace: WebhookRouter
            MetricName: DeliveryAttempts
            Dimensions:
            - Name: Application
              Value:
                Ref: ApplicationName
            - Name: Environment
              Value:
                Ref: Environment
            - Name: Service
              Value: worker
          Period: 300
          Stat: Sum
      - Id: failures
        ReturnData: false
        MetricStat:
          Metric:
            Namespace: WebhookRouter
            MetricName: DeliveryFailures
            Dimensions:
            - Name: Application
              Value:
                Ref: ApplicationName
            - Name: Environment
              Value:
                Ref: Environment
            - Name: Service
              Value: worker
          Period: 300
          Stat: Sum
  Api4xxRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlarmTopic
      Metrics:
      - Id: rate
        Expression: IF(traffic>=20,100*FILL(errors,0)/traffic,0)
        ReturnData: true
      - Id: errors
        ReturnData: false
        MetricStat:
          Metric:
            Namespace: AWS/ApiGateway
            MetricName: 4XXError
            Dimensions:
            - Name: ApiName
              Value:
                Fn::Sub: ${ApplicationName}-${Environment}
            - Name: Stage
              Value:
                Ref: Environment
          Period: 300
          Stat: Sum
      - Id: traffic
        ReturnData: false
        MetricStat:
          Metric:
            Namespace: AWS/ApiGateway
            MetricName: Count
            Dimensions:
            - Name: ApiName
              Value:
                Fn::Sub: ${ApplicationName}-${Environment}
            - Name: Stage
              Value:
                Ref: Environment
          Period: 300
          Stat: SampleCount
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
      - Name: ApiName
        Value:
          Fn::Sub: ${ApplicationName}-${Environment}
      - Name: Stage
        Value:
          Ref: Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlarmTopic
  DeliveryDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - DeliveryDLQ
          - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlarmTopic
  StreamFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - StreamFailureQueue
          - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlarmTopic
  BacklogAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - DeliveryQueue
          - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 120
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlarmTopic
  OutboxAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: WebhookRouter
      MetricName: OutboxAge
      Dimensions:
      - Name: Application
        Value:
          Ref: ApplicationName
      - Name: Environment
        Value:
          Ref: Environment
      - Name: Service
        Value: dispatch
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 120
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions:
      - Ref: AlarmTopic
  IngestionLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: WebhookRouter
      MetricName: IngestionLatency
      Dimensions:
      - Name: Application
        Value:
          Ref: ApplicationName
      - Name: Environment
        Value:
          Ref: Environment
      - Name: Service
        Value: ingest
      ExtendedStatistic: p95
      EvaluateLowSampleCountPercentile: ignore
      Period: 300
      EvaluationPeriods: 3
      Threshold: 200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlarmTopic
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName:
        Fn::Sub: ${ApplicationName}-${Environment}
      DashboardBody:
        Fn::Sub: |-
          {
            "widgets": [
              {
                "type": "metric",
                "x": 0,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "API traffic and errors (5m)",
                  "region": "${AWS::Region}",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/ApiGateway",
                      "Count",
                      "ApiName",
                      "${ApplicationName}-${Environment}",
                      "Stage",
                      "${Environment}",
                      {
                        "stat": "SampleCount"
                      }
                    ],
                    [
                      "AWS/ApiGateway",
                      "4XXError",
                      "ApiName",
                      "${ApplicationName}-${Environment}",
                      "Stage",
                      "${Environment}"
                    ],
                    [
                      "AWS/ApiGateway",
                      "5XXError",
                      "ApiName",
                      "${ApplicationName}-${Environment}",
                      "Stage",
                      "${Environment}"
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 0,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Gateway integration latency (p95, ms)",
                  "region": "${AWS::Region}",
                  "period": 300,
                  "stat": "p95",
                  "metrics": [
                    [
                      "AWS/ApiGateway",
                      "IntegrationLatency",
                      "ApiName",
                      "${ApplicationName}-${Environment}",
                      "Stage",
                      "${Environment}"
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 6,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Worker outcomes (5m)",
                  "region": "${AWS::Region}",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "WebhookRouter",
                      "Delivered",
                      "Application",
                      "${ApplicationName}",
                      "Environment",
                      "${Environment}",
                      "Service",
                      "worker"
                    ],
                    [
                      "WebhookRouter",
                      "DeliveryFailures",
                      "Application",
                      "${ApplicationName}",
                      "Environment",
                      "${Environment}",
                      "Service",
                      "worker"
                    ],
                    [
                      "WebhookRouter",
                      "DeliveryDuplicates",
                      "Application",
                      "${ApplicationName}",
                      "Environment",
                      "${Environment}",
                      "Service",
                      "worker"
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 6,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Process peak RSS / allocated memory (%) - custom metric",
                  "region": "${AWS::Region}",
                  "period": 300,
                  "stat": "Maximum",
                  "metrics": [
                    [
                      "WebhookRouter",
                      "MemoryUtilization",
                      "Application",
                      "${ApplicationName}",
                      "Environment",
                      "${Environment}",
                      "Service",
                      "ingest"
                    ],
                    [
                      "WebhookRouter",
                      "MemoryUtilization",
                      "Application",
                      "${ApplicationName}",
                      "Environment",
                      "${Environment}",
                      "Service",
                      "worker"
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 12,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Backlog age (seconds)",
                  "region": "${AWS::Region}",
                  "period": 60,
                  "stat": "Maximum",
                  "metrics": [
                    [
                      "AWS/SQS",
                      "ApproximateAgeOfOldestMessage",
                      "QueueName",
                      "${DeliveryQueue.QueueName}"
                    ],
                    [
                      "WebhookRouter",
                      "OutboxAge",
                      "Application",
                      "${ApplicationName}",
                      "Environment",
                      "${Environment}",
                      "Service",
                      "dispatch"
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 12,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "Dead-letter messages - investigate and replay",
                  "region": "${AWS::Region}",
                  "period": 60,
                  "stat": "Maximum",
                  "metrics": [
                    [
                      "AWS/SQS",
                      "ApproximateNumberOfMessagesVisible",
                      "QueueName",
                      "${DeliveryDLQ.QueueName}"
                    ],
                    [
                      "AWS/SQS",
                      "ApproximateNumberOfMessagesVisible",
                      "QueueName",
                      "${StreamFailureQueue.QueueName}"
                    ]
                  ]
                }
              }
            ]
          }
  AuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: authorize-scoped-access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Ref: AuthSecret
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationName}-${Environment}-authorize:*
          - Effect: Allow
            Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
            Resource: '*'
  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: ingest-scoped-access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource:
            - Fn::GetAtt:
              - RoutesTable
              - Arn
            - Fn::GetAtt:
              - EventsTable
              - Arn
          - Effect: Allow
            Action: dynamodb:PutItem
            Resource:
            - Fn::GetAtt:
              - EventsTable
              - Arn
            - Fn::GetAtt:
              - OutboxTable
              - Arn
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationName}-${Environment}-ingest:*
          - Effect: Allow
            Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
            Resource: '*'
  DispatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: dispatch-scoped-access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:DescribeStream
            - dynamodb:GetRecords
            - dynamodb:GetShardIterator
            Resource:
              Fn::GetAtt:
              - OutboxTable
              - StreamArn
          - Effect: Allow
            Action: dynamodb:ListStreams
            Resource: '*'
          - Effect: Allow
            Action: dynamodb:Query
            Resource:
              Fn::Sub: ${OutboxTable.Arn}/index/due
          - Effect: Allow
            Action: dynamodb:DeleteItem
            Resource:
              Fn::GetAtt:
              - OutboxTable
              - Arn
          - Effect: Allow
            Action: sqs:SendMessage
            Resource:
            - Fn::GetAtt:
              - DeliveryQueue
              - Arn
            - Fn::GetAtt:
              - StreamFailureQueue
              - Arn
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationName}-${Environment}-dispatch:*
          - Effect: Allow
            Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
            Resource: '*'
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: worker-scoped-access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            Resource:
              Fn::GetAtt:
              - EventsTable
              - Arn
          - Effect: Allow
            Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Fn::GetAtt:
              - DeliveryQueue
              - Arn
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ApplicationName}/${Environment}/${DestinationSecretPrefix}*
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationName}-${Environment}-worker:*
          - Effect: Allow
            Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
            Resource: '*'
          - Fn::If:
            - UseVpc
            - Effect: Allow
              Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
              Resource: '*'
            - Ref: AWS::NoValue
Outputs:
  WebhookUrl:
    Value:
      Fn::Sub: https://${WebhookApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/webhooks
  ApiId:
    Value:
      Ref: WebhookApi
  UsagePlanId:
    Value:
      Ref: UsagePlan
  AuthSecretArn:
    Value:
      Ref: AuthSecret
  RoutesTableName:
    Value:
      Ref: RoutesTable
  EventsTableName:
    Value:
      Ref: EventsTable
  OutboxTableName:
    Value:
      Ref: OutboxTable
  DeliveryQueueUrl:
    Value:
      Ref: DeliveryQueue
  DeliveryDLQUrl:
    Value:
      Ref: DeliveryDLQ
  StreamFailureQueueUrl:
    Value:
      Ref: StreamFailureQueue
  AlarmTopicArn:
    Value:
      Ref: AlarmTopic
Rules:
  ProductionInputs:
    Assertions:
    - Assert:
        Fn::Or:
        - Fn::Not:
          - Fn::Equals:
            - Ref: Environment
            - prod
        - Fn::Not:
          - Fn::Equals:
            - Ref: AlarmEmail
            - ''
      AssertDescription: Production requires an alarm recipient.
    - Assert:
        Fn::Or:
        - Fn::Not:
          - Fn::Equals:
            - Ref: Environment
            - prod
        - Fn::Not:
          - Fn::Equals:
            - Ref: AllowedDestinationHosts
            - ''
      AssertDescription: Production requires approved destination hosts.
